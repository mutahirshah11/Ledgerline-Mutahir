# Default gitleaks rules, plus a narrow allowlist for committed SHA-256 fixtures only.
[extend]
useDefault = true

[allowlist]
description = "Hex digests in test fixtures are not secrets"
paths = [
  '''apps/api/tests/pack_hashes\.json''',
  '''apps/api/tests/ground_truth/.*\.json''',
  # Cached model reads (research R10): each record names its page image by SHA-256 hex digest.
  '''supabase/seed/extractions/.*\.json''',
]
